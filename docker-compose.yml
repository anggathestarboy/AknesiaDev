services:
    app:
        build:
            context: .
        ports:
            # Change the host-side "8080" if that port is already taken —
            # this is the one docker-compose.yml value that can't live in
            # .env.docker (port mapping is resolved before any container's
            # env is even read).
            - "8080:80"
        env_file:
            - .env.docker
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - storage-app:/app/storage/app
        restart: unless-stopped

    db:
        image: mysql:8.4
        env_file:
            - .env.docker
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            # $$ (not $) so Compose passes a literal "$MYSQL_ROOT_PASSWORD"
            # into the container, expanded by its own shell from the
            # container's real runtime env (set via env_file above) — not
            # by Compose's separate, unrelated top-level "${...}" mechanism.
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    db-data:
    storage-app:
